<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scalable E-Commerce Backend Platform architecture</title>
  <desc id="desc">A neutral diagram showing clients, a Go API, PostgreSQL, Redis, an outbox, stream workers, and metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7f2"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2d2a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#bg)"/>
  <g fill="#24423b" font-family="Inter,Arial,sans-serif">
    <text x="72" y="86" font-size="22" font-weight="700" letter-spacing="2">BACKEND SYSTEMS · CLOUD NATIVE</text>
    <text x="72" y="138" font-size="38" font-weight="800">Scalable E-Commerce Backend Platform</text>
    <text x="72" y="174" font-size="19" fill="#61746f">Transactional ordering, idempotency, and event-processing foundations</text>
  </g>
  <g stroke="#6d8c84" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M220 338h115"/><path d="M525 338h90"/><path d="M805 338h85"/>
    <path d="M430 410v74h120"/><path d="M710 410v74h-160"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g><rect x="72" y="270" width="148" height="136" rx="24" fill="#fff"/><text x="146" y="330" font-size="20" font-weight="700" fill="#24423b">Clients</text><text x="146" y="362" font-size="15" fill="#6a7773">Web · Admin</text></g>
    <g><rect x="335" y="245" width="190" height="190" rx="28" fill="#197a69"/><text x="430" y="328" font-size="24" font-weight="800" fill="#fff">Go API</text><text x="430" y="362" font-size="15" fill="#d8f0ea">Auth · Orders</text><text x="430" y="387" font-size="15" fill="#d8f0ea">Inventory</text></g>
    <g><rect x="615" y="270" width="190" height="136" rx="24" fill="#fff"/><text x="710" y="330" font-size="20" font-weight="700" fill="#24423b">PostgreSQL</text><text x="710" y="362" font-size="15" fill="#6a7773">Orders · Outbox</text></g>
    <g><rect x="890" y="270" width="190" height="136" rx="24" fill="#fff"/><text x="985" y="330" font-size="20" font-weight="700" fill="#24423b">Redis</text><text x="985" y="362" font-size="15" fill="#6a7773">Cache · Rate limit</text></g>
    <g><rect x="462" y="484" width="178" height="104" rx="22" fill="#fff"/><text x="551" y="530" font-size="18" font-weight="700" fill="#24423b">Stream Workers</text><text x="551" y="558" font-size="14" fill="#6a7773">Retry · Dead letter</text></g>
    <g><rect x="700" y="484" width="178" height="104" rx="22" fill="#fff"/><text x="789" y="530" font-size="18" font-weight="700" fill="#24423b">Metrics</text><text x="789" y="558" font-size="14" fill="#6a7773">Health · Prometheus</text></g>
  </g>
  <text x="72" y="630" font-family="Inter,Arial,sans-serif" font-size="15" fill="#71817d">Single-region repository scope · no production capacity claim</text>
</svg>
